name: Deploy to Minsk VPS

# Деплой на собственный VPS в Минске: после пуша в main подключаемся по SSH
# и пересобираем проект в /opt/tarusin, затем перезапускаем сервис tarusin.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          SSH_KEY_B64: ${{ secrets.MINSK_SSH_KEY_B64 }}
        run: |
          echo "$SSH_KEY_B64" | base64 -d > /tmp/minsk_key
          chmod 600 /tmp/minsk_key

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.MINSK_HOST }}
          username: ${{ secrets.MINSK_USER }}
          key_path: /tmp/minsk_key
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /opt/tarusin
            git fetch origin main
            git reset --hard origin/main
            npm ci
            NODE_OPTIONS=--max-old-space-size=3072 npm run build
            systemctl restart tarusin
