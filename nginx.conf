server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Хэшированные ассеты Vite — один заголовок Cache-Control, без expires
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Клиентские SPA-маршруты без пререндера — оболочка со статусом 200
    location ~ ^/(admin|cabinet|p|en)(/|$) {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
        try_files /index.html =404;
    }

    # SSG-страницы (nested dirStyle); несуществующие URL получают честный 404,
    # но с оболочкой приложения — React Router покажет страницу NotFound
    location / {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
        try_files $uri $uri/ $uri/index.html =404;
        error_page 404 /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
    }
}
